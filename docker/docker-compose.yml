version: '3.8'

# This compose file represents the backend project runtime used by CI and local
# deployment. The frontend is intentionally not part of this system boundary.
services:
  pmhub-nacos:
    container_name: pmhub-nacos
    image: nacos/nacos-server:v2.2.3
    build:
      context: ./nacos
      dockerfile: dockerfile
    environment:
      - MODE=standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - pmhub-mysql
  pmhub-mysql:
    container_name: pmhub-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "33706:3306" # 有经验的开发不会直接暴露3306端口
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=2G',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=2'
        ]
    environment:
      # Set MYSQL_ROOT_PASSWORD in the shell or CI job. Do not commit the value.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  pmhub-redis:
    container_name: pmhub-redis
    image: redis:7-alpine
    build:
      context: ./redis
      dockerfile: dockerfile
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/pmhub/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/pmhub/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  pmhub-seata:
    container_name: pmhub-seata
    image: seataio/seata-server:1.5.2
    ports:
      - "7091:7091"
      - "8091:8091"
    volumes:
      - ./seata/seata-application.yml:/seata-server/resources/application.yml
    environment:
      - SEATA_PORT=8091
    depends_on:
      pmhub-nacos:
        condition: service_healthy
      pmhub-mysql:
        condition: service_healthy
    links:
      - pmhub-nacos
      - pmhub-mysql
  pmhub-gateway:
    container_name: pmhub-gateway
    build:
      context: ../pmhub-gateway
      dockerfile: docker/Dockerfile
    ports:
      - "6880:6880"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_REDIS_HOST=pmhub-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      pmhub-redis:
        condition: service_healthy
      pmhub-nacos:
        condition: service_healthy
    links:
      - pmhub-redis
      - pmhub-nacos
  pmhub-auth:
    container_name: pmhub-auth
    build:
      context: ../pmhub-auth
      dockerfile: docker/Dockerfile
    ports:
      - "6800:6800"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_REDIS_HOST=pmhub-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      pmhub-redis:
        condition: service_healthy
      pmhub-nacos:
        condition: service_healthy
    links:
      - pmhub-redis
  pmhub-system:
    container_name: pmhub-system
    build:
      context: ../pmhub-modules/pmhub-system
      dockerfile: docker/Dockerfile
    ports:
      - "6801:6801"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_REDIS_HOST=pmhub-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      pmhub-redis:
        condition: service_healthy
      pmhub-mysql:
        condition: service_healthy
      pmhub-nacos:
        condition: service_healthy
    links:
      - pmhub-redis
      - pmhub-mysql
  pmhub-gen:
    container_name: pmhub-gen
    build:
      context: ../pmhub-modules/pmhub-gen
      dockerfile: docker/Dockerfile
    ports:
      - "6802:6802"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_REDIS_HOST=pmhub-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      pmhub-mysql:
        condition: service_healthy
      pmhub-nacos:
        condition: service_healthy
    links:
      - pmhub-mysql
  pmhub-job:
    container_name: pmhub-job
    build:
      context: ../pmhub-modules/pmhub-job
      dockerfile: docker/Dockerfile
    ports:
      - "6803:6803"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_REDIS_HOST=pmhub-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      pmhub-mysql:
        condition: service_healthy
      pmhub-nacos:
        condition: service_healthy
    links:
      - pmhub-mysql

  pmhub-project:
    container_name: pmhub-project
    build:
      context: ../pmhub-modules/pmhub-project
      dockerfile: docker/Dockerfile
    ports:
      - "6806:6806"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_REDIS_HOST=pmhub-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      pmhub-redis:
        condition: service_healthy
      pmhub-mysql:
        condition: service_healthy
      pmhub-nacos:
        condition: service_healthy
    links:
      - pmhub-redis
      - pmhub-mysql

  pmhub-workflow:
    container_name: pmhub-workflow
    build:
      context: ../pmhub-modules/pmhub-workflow
      dockerfile: docker/Dockerfile
    ports:
      - "6808:6808"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://pmhub-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_REDIS_HOST=pmhub-redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      pmhub-redis:
        condition: service_healthy
      pmhub-mysql:
        condition: service_healthy
      pmhub-nacos:
        condition: service_healthy
    links:
      - pmhub-redis
