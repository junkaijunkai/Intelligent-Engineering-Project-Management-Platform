# Trivy 漏洞豁免登记表（.trivyignore.yaml）
#
# 使用原则：
#   1. 每条豁免 = 一次书面安全评估记录，不是"跳过扫描"。
#   2. statement 必须写明评估结论：为什么该 CVE 在本容器不可利用或可接受。
#   3. expired_at 是强制字段：到期后 Trivy 会重新告警，
#      迫使团队重新评估，防止"豁免"变成"遗忘"。
#   4. 修复完成后，删除对应条目，让扫描重新覆盖该 CVE。
#
# 示例（取消注释并替换为真实评估结论后生效）：
# vulnerabilities:
#   - id: CVE-2023-45853
#     statement: zlib 压缩炸弹，仅影响直接解析外部 zlib 流的场景；
#                本容器不处理外部压缩输入，攻击向量不可达。
#     expired_at: 2026-11-30
vulnerabilities: []
