# ============================================================
# CI 测试环境配置（不依赖 Nacos）
# ============================================================
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  # 数据源（CI 容器：localhost:3306，库：pmhub_test）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: jdbc:mysql://localhost:3306/pmhub-project?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
        username: root
        password: root
      slave:
        enabled: false
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 60000
      validationQuery: SELECT 1

  # Redis（CI 容器：localhost:6379）
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms
