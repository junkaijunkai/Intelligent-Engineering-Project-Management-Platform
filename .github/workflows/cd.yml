name: CD - Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ACR image tag to deploy (defaults to the selected commit SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-ecs-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_ROOT: /opt/namespace
  COMPOSE_DIR: /opt/namespace/docker

jobs:
  resolve-env:
    name: Resolve deployment environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ inputs.image_tag || github.sha }}
        run: |
          echo "deploy_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          case "${SOURCE_REF}" in
            master) echo 'env_name=prod' >> "$GITHUB_OUTPUT" ;;
            pre)    echo 'env_name=pre' >> "$GITHUB_OUTPUT" ;;
            *)      echo 'env_name=test' >> "$GITHUB_OUTPUT" ;;
          esac

  deploy:
    name: Deploy ${{ needs.resolve-env.outputs.env_name }} to ECS
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.env_name }}
    timeout-minutes: 30
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-env.outputs.deploy_sha }}

      - name: Validate deployment secrets
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ACR_REGISTRY ACR_USERNAME ACR_PASSWORD ECS_HOST ECS_USER ECS_SSH_KEY MYSQL_ROOT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" > "$HOME/.ssh/ecs_deploy_key"
          chmod 600 "$HOME/.ssh/ecs_deploy_key"
          ssh-keyscan -H "$ECS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Sync Compose deployment files
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/docker-config.tgz" \
            --exclude='./mysql/data' --exclude='./mysql/logs' \
            --exclude='./redis/data' --exclude='./.env' -C docker .
          scp -i "$HOME/.ssh/ecs_deploy_key" "$RUNNER_TEMP/docker-config.tgz" \
            "$ECS_USER@$ECS_HOST:/opt/namespace/docker-config.tgz"
          ssh -i "$HOME/.ssh/ecs_deploy_key" "$ECS_USER@$ECS_HOST" \
            'mkdir -p /opt/namespace/docker && tar -xzf /opt/namespace/docker-config.tgz -C /opt/namespace/docker && rm -f /opt/namespace/docker-config.tgz'

      - name: Prepare ACR image override and runtime environment
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_ENV: ${{ needs.resolve-env.outputs.env_name }}
          DEPLOY_SHA: ${{ needs.resolve-env.outputs.deploy_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cd"
          sed -e "s|^db.url.0=.*|db.url.0=jdbc:mysql://pmhub-mysql:3306/pmhub-nacos?characterEncoding=utf8\\&useUnicode=true\\&useSSL=false\\&serverTimezone=UTC|" \
            -e "s|^db.password=.*|db.password=${MYSQL_ROOT_PASSWORD}|" \
            docker/nacos/conf/application.properties > "$RUNNER_TEMP/cd/nacos-application.properties"
          sed -e "s|jdbc:mysql://localhost:3306/|jdbc:mysql://pmhub-mysql:3306/|g" \
            -e "s|127.0.0.1:8848|pmhub-nacos:8848|g" \
            -e "s|password: 123456|password: ${MYSQL_ROOT_PASSWORD}|g" \
            docker/seata/seata-application.yml > "$RUNNER_TEMP/cd/seata-application.yml"
          sed -e "s#jdbc:mysql://127.0.0.1:3306/#jdbc:mysql://pmhub-mysql:3306/#g" \
            -e "s/host: localhost/host: pmhub-redis/g" \
            -e "s/host: 127.0.0.1/host: pmhub-redis/g" \
            -e "s#redis://localhost:6379#redis://pmhub-redis:6379#g" \
            -e "s|server-addr: 127.0.0.1:8848|server-addr: pmhub-nacos:8848|g" \
            -e "s|password: 123456|password: ${MYSQL_ROOT_PASSWORD}|g" \
            sql/pmhub_nacos.sql > "$RUNNER_TEMP/cd/pmhub_nacos-ecs.sql"
          tar -czf "$RUNNER_TEMP/cd/database-init.tgz" -C sql \
            pmhub-system.sql pmhub-project.sql pmhub-workflow.sql pmhub-gen.sql pmhub_seata.sql
          cat > "$RUNNER_TEMP/cd/docker-compose.acr.yml" <<EOF
          services:
            pmhub-gateway:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-gateway:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-auth:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-auth:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-system:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-system:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-project:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-project:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-workflow:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-workflow:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-gen:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-gen:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-job:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-job:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-monitor:
              image: ${ACR_REGISTRY}/engineering-management/pmhub-monitor:${DEPLOY_SHA}
              build: null
              environment:
                SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV}
            pmhub-nacos:
              volumes:
                - /opt/namespace/config/nacos-application.properties:/home/nacos/conf/application.properties:ro
            pmhub-seata:
              volumes:
                - /opt/namespace/config/seata-application.yml:/seata-server/resources/application.yml:ro
          EOF
          {
            printf 'ACR_REGISTRY=%q\n' "$ACR_REGISTRY"
            printf 'ACR_USERNAME=%q\n' "$ACR_USERNAME"
            printf 'ACR_PASSWORD=%q\n' "$ACR_PASSWORD"
            printf 'MYSQL_ROOT_PASSWORD=%q\n' "$MYSQL_ROOT_PASSWORD"
            printf 'DEPLOY_SHA=%q\n' "$DEPLOY_SHA"
            printf 'DEPLOY_ENV=%q\n' "$DEPLOY_ENV"
          } > "$RUNNER_TEMP/cd/deploy.env"
          chmod 600 "$RUNNER_TEMP/cd/docker-compose.acr.yml" "$RUNNER_TEMP/cd/deploy.env"
          scp -i "$HOME/.ssh/ecs_deploy_key" "$RUNNER_TEMP/cd/docker-compose.acr.yml" \
            "$RUNNER_TEMP/cd/deploy.env" "$RUNNER_TEMP/cd/nacos-application.properties" \
            "$RUNNER_TEMP/cd/seata-application.yml" "$RUNNER_TEMP/cd/pmhub_nacos-ecs.sql" \
            "$RUNNER_TEMP/cd/database-init.tgz" "$ECS_USER@$ECS_HOST:/opt/namespace/"

      - name: Pull, deploy, smoke test, and rollback on failure
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ecs_deploy_key" "$ECS_USER@$ECS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          set -a
          source /opt/namespace/deploy.env
          set +a
          mkdir -p /opt/namespace/config /opt/namespace/database-init
          mv /opt/namespace/nacos-application.properties /opt/namespace/config/nacos-application.properties
          mv /opt/namespace/seata-application.yml /opt/namespace/config/seata-application.yml
          mv /opt/namespace/pmhub_nacos-ecs.sql /opt/namespace/database-init/pmhub_nacos-ecs.sql
          tar -xzf /opt/namespace/database-init.tgz -C /opt/namespace/database-init
          rm -f /opt/namespace/database-init.tgz
          COMPOSE=(docker compose -p engineering-management -f /opt/namespace/docker/docker-compose.yml -f /opt/namespace/docker/docker-compose.acr.yml)
          rollback() {
            previous="$(cat /opt/namespace/.last_deployed_sha 2>/dev/null || true)"
            if [ -z "$previous" ]; then
              echo 'No previous deployment recorded; rollback skipped.'
              return
            fi
            echo "Deployment failed; rolling back to $previous"
            sed -i "s/:${DEPLOY_SHA}/:${previous}/g" /opt/namespace/docker/docker-compose.acr.yml
            "${COMPOSE[@]}" pull
            "${COMPOSE[@]}" up -d
            exit 1
          }
          trap rollback ERR
          cd /opt/namespace/docker
          printf '%s\n' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
            --username "$ACR_USERNAME" --password-stdin
          "${COMPOSE[@]}" pull
          "${COMPOSE[@]}" up -d pmhub-mysql pmhub-redis pmhub-nacos
          if [ ! -f /opt/namespace/.databases_initialized ]; then
            echo 'Initializing ECS databases from deployment SQL bundle'
            mysql_ready=false
            for i in $(seq 1 60); do
              if docker run --rm --network engineering-management_default -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" \
                mysql:5.7 mysql -h pmhub-mysql -P 3306 -u root -e 'SELECT 1' >/dev/null 2>&1; then
                mysql_ready=true
                break
              fi
              sleep 2
            done
            if [ "$mysql_ready" != true ]; then
              echo 'MySQL did not become ready for database initialization' >&2
              exit 1
            fi
            for sql_file in pmhub-system.sql pmhub-project.sql pmhub-workflow.sql pmhub-gen.sql pmhub_seata.sql pmhub_nacos-ecs.sql; do
              docker run --rm -i --network engineering-management_default -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" \
                -v "/opt/namespace/database-init/$sql_file:/evidence.sql:ro" \
                mysql:5.7 mysql -h pmhub-mysql -P 3306 -u root < "/opt/namespace/database-init/$sql_file"
            done
            touch /opt/namespace/.databases_initialized
          fi
          "${COMPOSE[@]}" up -d pmhub-seata pmhub-gateway pmhub-auth
          "${COMPOSE[@]}" up -d pmhub-system pmhub-project pmhub-workflow pmhub-gen pmhub-job pmhub-monitor
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            http://127.0.0.1:6880/actuator/health
          "${COMPOSE[@]}" ps
          printf '%s\n' "$DEPLOY_SHA" > /opt/namespace/.last_deployed_sha
          rm -f /opt/namespace/deploy.env /opt/namespace/docker/docker-compose.acr.yml
          docker logout "$ACR_REGISTRY" >/dev/null 2>&1 || true
          REMOTE

      - name: Deployment summary
        if: always()
        run: |
          echo "Environment: ${{ needs.resolve-env.outputs.env_name }}"
          echo "Image tag: ${{ needs.resolve-env.outputs.deploy_sha }}"
          echo "Target: ECS via ACR"
