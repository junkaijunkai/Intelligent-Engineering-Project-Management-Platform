name: DevSecOps Demo Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devsecops-demo:
    name: Build DevSecOps Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      MAVEN_OPTS: "-Dfile.encoding=UTF-8"
      DEVSECOPS_ARTIFACT_MANIFEST: "artifact-manifest-ci.txt"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Prepare evidence workspace
        run: bash devsecops-demo/scripts/preflight.sh

      - name: Run unit tests and coverage
        id: unit_tests
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-unit-tests.sh

      - name: Build and start frontend demo container
        id: frontend
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-container-evidence.sh

      - name: Run integration smoke test
        id: integration
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-integration-smoke.sh

      - name: Run k6 load test
        id: load_test
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-load-test.sh

      - name: Run Semgrep SAST
        id: sast
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-sast.sh

      - name: Run Trivy image and IaC scans
        id: trivy
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-trivy.sh

      - name: Try gateway and Redis evidence
        id: gateway
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-gateway-demo.sh

      - name: Run ZAP baseline DAST
        id: dast
        continue-on-error: true
        run: bash devsecops-demo/scripts/run-dast.sh

      - name: Normalize artifact permissions
        if: always()
        run: bash devsecops-demo/scripts/normalize-artifact-permissions.sh

      - name: Generate audit and compliance evidence
        if: always()
        run: bash devsecops-demo/scripts/generate-compliance.sh

      - name: Normalize generated evidence permissions
        if: always()
        run: bash devsecops-demo/scripts/normalize-artifact-permissions.sh

      - name: Sanitize evidence
        if: always()
        run: bash devsecops-demo/scripts/sanitize-artifacts.sh

      - name: Verify evidence completeness
        if: always()
        run: bash devsecops-demo/scripts/verify-artifacts.sh

      - name: Upload unified evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-evidence
          path: devsecops-demo/out/
          retention-days: 90
          if-no-files-found: error

      - name: Clean up demo resources
        if: always()
        run: bash devsecops-demo/scripts/cleanup.sh
