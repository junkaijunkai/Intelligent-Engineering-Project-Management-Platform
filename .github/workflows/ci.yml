name: CI - Lint, Test, SAST, Build

on:
  push:
    branches:
      - master
      - dev
      - pre
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      run_owasp:
        description: "Run OWASP Dependency Check"
        type: boolean
        default: false

env:
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository -Dfile.encoding=UTF-8"

jobs:
  # ============================================================
  # Stage 1: Linting — Checkstyle 代码风格检查
  # ============================================================
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run Checkstyle
        run: mvn checkstyle:check -B -Dcheckstyle.failOnViolation=false -Dcheckstyle.failsOnError=false -Dcheckstyle.violationSeverity=warning

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: "**/target/checkstyle-result.xml"
          retention-days: 7

  # ============================================================
  # Stage 2: 单元测试 + 覆盖率
  # ============================================================
  unit-test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      checks: write
      contents: read
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pmhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Init MySQL schema
        run: |
          sudo apt-get install -y -qq mysql-client
          for sql in sql/pmhub-system.sql sql/pmhub-project.sql sql/pmhub-workflow.sql sql/pmhub-gen.sql sql/pmhub_seata.sql; do
            echo "Executing $sql..."
            mysql -h 127.0.0.1 -u root -proot < $sql
          done

      - name: Run tests with JaCoCo
        run: mvn test -B -Dspring.profiles.active=test

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Maven Test Report
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/"
          retention-days: 7

  # ============================================================
  # Stage 3: SAST — SonarCloud 代码质量 + 安全分析
  # ============================================================
  sonarqube:
    name: SAST (SonarCloud)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud 需要完整 git 历史做 blame

      - name: Set up JDK 17  # SonarCloud Scanner 需要 JDK 17+
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Compile and SonarCloud Scan
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn compile sonar:sonar -B
          -Dsonar.organization=${{ secrets.SONAR_ORG }}
          -Dsonar.projectKey=${{ github.event.repository.name }}
          -Dsonar.projectName=${{ github.event.repository.name }}
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
          -Dsonar.cpd.exclusions=**/entity/**,**/dto/**,**/vo/**,**/*DTO.java,**/*Entity.java,**/*VO.java
          -Dsonar.qualitygate.wait=false

  # ============================================================
  # Stage 4: SAST-Dependency — OWASP 依赖漏洞扫描
  # ============================================================
  dependency-check:
    name: SAST (OWASP Dependency Check)
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/pre' ||
      github.event_name == 'workflow_dispatch' && inputs.run_owasp == true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17  # OWASP 12.x 需要 JDK 11+
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      # 先编译安装本地模块，避免 dependency-check 找不到子模块依赖
      - name: Build local modules
        run: mvn install -DskipTests -B

      - name: Run OWASP Dependency Check
        env:
          OSSINDEX_USER: ${{ secrets.OSSINDEX_USER }}
          OSSINDEX_PASS: ${{ secrets.OSSINDEX_PASS }}
        run: mvn org.owasp:dependency-check-maven:check -B -DfailBuildOnCVSS=11 -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.html"
          retention-days: 7

  # ============================================================
  # Stage 5: 构建打包
  # ============================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [sonarqube, dependency-check]
    if: |
      always() &&
      (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped') &&
      (needs.dependency-check.result == 'success' || needs.dependency-check.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -B -DskipTests -U

      # 按 pmhub-boot Dockerfile 的约定，上传 jar 供 CD 使用
      - name: Upload gateway jar (boot package)
        uses: actions/upload-artifact@v4
        with:
          name: jar-pmhub-gateway
          path: pmhub-gateway/target/*.jar
          retention-days: 3

      - name: Upload auth jar (boot package)
        uses: actions/upload-artifact@v4
        with:
          name: jar-pmhub-auth
          path: pmhub-auth/target/*.jar
          retention-days: 3

      - name: Upload modules jars
        uses: actions/upload-artifact@v4
        with:
          name: jar-pmhub-modules
          path: pmhub-modules/*/target/*.jar
          retention-days: 3

      - name: Upload monitor jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-pmhub-monitor
          path: pmhub-monitor/target/*.jar
          retention-days: 3
