name: CI Quality

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload quality reports and application packages"
        type: boolean
        required: false
        default: false
      enforce_quality_gate:
        description: "Fail CI when unit tests or coverage gates fail"
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      upload_artifacts:
        description: "Upload quality reports and application packages"
        type: boolean
        required: false
        default: false
      enforce_quality_gate:
        description: "Fail CI when unit tests or coverage gates fail"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  CI: "true"
  DEPLOY_ENV: ci
  COMPLIANCE_MODE: ci
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository -Dfile.encoding=UTF-8"

jobs:
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Run Checkstyle
        run: mvn checkstyle:check -B -Dcheckstyle.failOnViolation=false -Dcheckstyle.failsOnError=false -Dcheckstyle.violationSeverity=warning
      - name: Upload Checkstyle report
        if: ${{ always() && inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-checkstyle
          path: "**/target/checkstyle-result.xml"
          if-no-files-found: warn
          retention-days: 7

  unit-test:
    name: Unit Tests (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: ${{ inputs.enforce_quality_gate == false }}
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: pmhub-gateway, module: pmhub-gateway }
          - { name: pmhub-auth, module: pmhub-auth }
          - { name: pmhub-system, module: pmhub-modules/pmhub-system }
          - { name: pmhub-project, module: pmhub-modules/pmhub-project }
          - { name: pmhub-workflow, module: pmhub-modules/pmhub-workflow }
          - { name: pmhub-job, module: pmhub-modules/pmhub-job }
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pmhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Initialize MySQL schema
        run: |
          sudo apt-get install -y -qq mysql-client
          for sql in sql/pmhub-system.sql sql/pmhub-project.sql sql/pmhub-workflow.sql sql/pmhub-gen.sql sql/pmhub_seata.sql; do
            mysql -h 127.0.0.1 -u root -proot < "$sql"
          done
      - name: Run unit tests and collect CI evidence
        env:
          UNIT_TEST_MODULE: ${{ matrix.service.module }}
          UNIT_TEST_SERVICE: ${{ matrix.service.name }}
          ENFORCE_QUALITY_GATE: ${{ inputs.enforce_quality_gate }}
        run: bash ci/scripts/preflight.sh && bash ci/scripts/run-unit-tests.sh
      - name: Print unit test summary to job log
        if: always()
        run: |
          if [ -f devsecops-demo/out/01-testing/unit/${{ matrix.service.name }}/unit-test-summary.json ]; then
            cat devsecops-demo/out/01-testing/unit/${{ matrix.service.name }}/unit-test-summary.json
          else
            echo 'unit-test-summary.json was not generated'
          fi
      - name: Publish JUnit report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Maven Test Report
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit
      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-unit-test-${{ matrix.service.name }}
          path: devsecops-demo/out/
          if-no-files-found: warn
          retention-days: 7

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: unit-test
    if: always()
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download unit test evidence
        uses: actions/download-artifact@v4
        with:
          pattern: devsecops-ci-unit-test-*
          path: devsecops-demo/out/
          merge-multiple: true
      - name: Evaluate coverage gate
        env:
          ENFORCE_QUALITY_GATE: ${{ inputs.enforce_quality_gate }}
        run: bash ci/scripts/evaluate-coverage-gate.sh
      - name: Upload coverage gate artifacts
        if: ${{ always() && inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-coverage-gate
          path: devsecops-demo/out/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build Maven Packages
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Build packages
        run: mvn clean package -B -DskipTests -U
      - name: Upload application packages
        if: ${{ inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-jars
          path: |
            pmhub-gateway/target/*.jar
            pmhub-auth/target/*.jar
            pmhub-modules/*/target/*.jar
            pmhub-monitor/target/*.jar
          if-no-files-found: warn
          retention-days: 7
