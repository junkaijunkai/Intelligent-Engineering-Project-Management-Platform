name: CI Quality

on:
  push:
    branches:
      - master
      - dev
      - pre
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload quality reports and application packages"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      upload_artifacts:
        description: "Upload quality reports and application packages"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CI: "true"
  DEPLOY_ENV: ci
  COMPLIANCE_MODE: ci
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository -Dfile.encoding=UTF-8"

jobs:
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Run Checkstyle
        run: mvn checkstyle:check -B -Dcheckstyle.failOnViolation=false -Dcheckstyle.failsOnError=false -Dcheckstyle.violationSeverity=warning
      - name: Upload Checkstyle report
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.upload_artifacts == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-checkstyle
          path: "**/target/checkstyle-result.xml"
          if-no-files-found: warn
          retention-days: 7

  unit-test:
    name: Unit Tests and Coverage
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      checks: write
      contents: read
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pmhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Initialize MySQL schema
        run: |
          sudo apt-get install -y -qq mysql-client
          for sql in sql/pmhub-system.sql sql/pmhub-project.sql sql/pmhub-workflow.sql sql/pmhub-gen.sql sql/pmhub_seata.sql; do
            mysql -h 127.0.0.1 -u root -proot < "$sql"
          done
      - name: Run unit tests and collect CI evidence
        run: bash ci/scripts/preflight.sh && bash ci/scripts/run-unit-tests.sh
      - name: Publish JUnit report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Maven Test Report
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit
      - name: Upload unit test artifacts
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.upload_artifacts == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-unit-test
          path: devsecops-demo/out/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build Maven Packages
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Build packages
        run: mvn clean package -B -DskipTests -U
      - name: Upload application packages
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-jars
          path: |
            pmhub-gateway/target/*.jar
            pmhub-auth/target/*.jar
            pmhub-modules/*/target/*.jar
            pmhub-monitor/target/*.jar
          if-no-files-found: warn
          retention-days: 7
