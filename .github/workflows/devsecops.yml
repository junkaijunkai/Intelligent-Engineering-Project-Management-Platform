name: DevSecOps CI

on:
  workflow_dispatch:
    inputs:
      run_dast:
        description: "Run DAST scan"
        type: boolean
        required: false
        default: false
      upload_artifacts:
        description: "Upload CI artifacts (requires available Actions storage)"
        type: boolean
        required: false
        default: false
      enforce_quality_gate:
        description: "Fail quality pipeline when unit tests or coverage gates fail"
        type: boolean
        required: false
        default: true
      enforce_security_gate:
        description: "Fail security pipeline when image vulnerability gates fail"
        type: boolean
        required: false
        default: true
      publish_pages:
        description: "Publish evidence report site to GitHub Pages"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  checks: write

concurrency:
  group: devsecops-full-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DEPLOY_ENV: ci
  COMPLIANCE_MODE: ci
  DEVSECOPS_ARTIFACT_MANIFEST: artifact-manifest-project-ci.txt

jobs:
  quality:
    name: Quality Pipeline
    uses: ./.github/workflows/ci.yml
    with:
      upload_artifacts: ${{ inputs.upload_artifacts }}
      enforce_quality_gate: ${{ inputs.enforce_quality_gate }}

  security:
    name: Security Audit Pipeline
    needs: quality
    uses: ./.github/workflows/devsecops-security.yml
    with:
      run_image_scan: true
      enforce_security_gate: ${{ inputs.enforce_security_gate }}
      upload_artifacts: ${{ inputs.upload_artifacts }}
    secrets:

  runtime:
    name: Dev Runtime Pipeline
    needs: quality
    uses: ./.github/workflows/devsecops-runtime-only.yml
    with:
      run_dast: ${{ inputs.run_dast }}
      push_images: true
      upload_artifacts: ${{ inputs.upload_artifacts }}
    secrets:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

  compliance:
    name: Compliance as Code
    runs-on: ubuntu-latest
    needs: [security, runtime]
    if: ${{ always() && inputs.upload_artifacts == true }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download CI evidence
        uses: actions/download-artifact@v4
        with:
          pattern: devsecops-ci-*
          path: devsecops-demo/out/
          merge-multiple: true
      - name: Generate compliance evidence
        run: bash ci/scripts/preflight.sh && bash ci/scripts/generate-compliance.sh
      - name: Verify required artifacts
        run: bash ci/scripts/verify-artifacts.sh
      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-compliance
          path: devsecops-demo/out/04-compliance/
          if-no-files-found: warn
          retention-days: 7

  evidence-package:
    name: Unified CI Evidence Package
    runs-on: ubuntu-latest
    needs: [quality, security, runtime, compliance]
    if: ${{ always() && inputs.upload_artifacts == true }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download CI evidence
        uses: actions/download-artifact@v4
        with:
          pattern: devsecops-ci-*
          path: devsecops-demo/out/
          merge-multiple: true
      - name: Normalize, sanitize, and verify evidence
        run: |
          bash ci/scripts/normalize-artifact-permissions.sh
          bash ci/scripts/sanitize-artifacts.sh
          bash ci/scripts/verify-artifacts.sh
      - name: Print verification report to job log
        if: always()
        run: |
          if [ -f devsecops-demo/out/00-metadata/artifact-verification.txt ]; then
            cat devsecops-demo/out/00-metadata/artifact-verification.txt
          else
            echo 'artifact-verification.txt was not generated'
          fi
      - name: Upload unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-evidence
          path: devsecops-demo/out/
          if-no-files-found: warn
          retention-days: 7

  evidence-site:
    name: Evidence Report Site (GitHub Pages)
    runs-on: ubuntu-latest
    needs: evidence-package
    if: ${{ inputs.upload_artifacts == true && inputs.publish_pages == true && needs.evidence-package.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download CI evidence
        uses: actions/download-artifact@v4
        with:
          pattern: devsecops-ci-*
          path: site/
          merge-multiple: true
      - name: Generate evidence index page
        run: bash ci/scripts/generate-evidence-site.sh site
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pipeline-summary:
    name: Pipeline Result Summary
    runs-on: ubuntu-latest
    needs: [quality, security, runtime, compliance, evidence-package, evidence-site]
    if: always()
    steps:
      - name: Print job results
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "security=${{ needs.security.result }}"
          echo "runtime=${{ needs.runtime.result }}"
          echo "compliance=${{ needs.compliance.result }}"
          echo "evidence-package=${{ needs.evidence-package.result }}"
          echo "evidence-site=${{ needs.evidence-site.result }}"
