name: Dev Runtime Verification

on:
  workflow_dispatch:
    inputs:
      run_dast:
        description: "Run DAST against the Compose Gateway"
        type: boolean
        required: false
        default: false
      upload_artifacts:
        description: "Upload externally downloadable runtime evidence artifacts"
        type: boolean
        required: false
        default: false
      push_images:
        description: "Push Compose-built images to ACR after runtime and DAST pass"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      run_dast:
        description: "Run DAST against the Compose Gateway"
        type: boolean
        required: false
        default: false
      upload_artifacts:
        description: "Upload externally downloadable runtime evidence artifacts"
        type: boolean
        required: false
        default: false
      push_images:
        description: "Push Compose-built images to ACR after runtime and DAST pass"
        type: boolean
        required: false
        default: false
    secrets:
      MYSQL_ROOT_PASSWORD:
        required: true
      ACR_REGISTRY:
        required: false
      ACR_USERNAME:
        required: false
      ACR_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CI: "true"
  DEPLOY_ENV: ci
  COMPLIANCE_MODE: ci
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository -Dfile.encoding=UTF-8"
  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

jobs:
  full-project-runtime:
    name: Full Project Compose Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Install runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Validate CI database secret
        run: test -n "$MYSQL_ROOT_PASSWORD"
      - name: Run runtime preflight
        run: bash ci/scripts/preflight.sh
      - name: Build runtime JARs for Compose contexts
        run: mvn clean package -B -DskipTests -U
      - name: Run full backend Compose runtime
        env:
          RUN_DAST: ${{ inputs.run_dast }}
        run: bash ci/scripts/run-full-project-runtime.sh
      - name: Push runtime-verified images to ACR
        if: ${{ inputs.push_images == true && success() }}
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACR_REGISTRY" -a -n "$ACR_USERNAME" -a -n "$ACR_PASSWORD"
          printf '%s\n' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
          case "${GITHUB_REF_NAME}" in
            master) env_tag=prod-latest ;;
            pre)    env_tag=pre-latest ;;
            *)      env_tag=test-latest ;;
          esac
          for service in pmhub-gateway pmhub-auth pmhub-system pmhub-project pmhub-workflow pmhub-gen pmhub-job pmhub-monitor; do
            image_id=$(awk -F= -v service="$service" '$1 == service { print $2 }' devsecops-demo/out/05-runtime/runtime-image-ids.env)
            test -n "$image_id"
            image="$ACR_REGISTRY/engineering-management/$service"
            docker tag "$image_id" "$image:${GITHUB_SHA}"
            docker push "$image:${GITHUB_SHA}"
            docker tag "$image_id" "$image:$env_tag"
            docker push "$image:$env_tag"
          done
          docker logout "$ACR_REGISTRY" >/dev/null 2>&1 || true
      - name: Print runtime diagnostics to job log
        if: always()
        run: |
          echo '--- Compose status ---'
          if [ -f devsecops-demo/out/05-runtime/compose-ps.txt ]; then
            sed -n '1,160p' devsecops-demo/out/05-runtime/compose-ps.txt
          else
            echo 'compose-ps.txt was not generated'
          fi
          echo '--- Nacos runtime log ---'
          nacos_log=devsecops-demo/out/05-runtime/logs/pmhub-nacos.log
          if [ -f "$nacos_log" ]; then
            cat "$nacos_log"
          else
            echo 'pmhub-nacos.log was not generated; runtime may have failed before Compose startup.'
          fi
          echo '--- Load test summary ---'
          if [ -f devsecops-demo/out/01-testing/load/k6-summary.json ]; then
            cat devsecops-demo/out/01-testing/load/k6-summary.json
          else
            echo 'k6-summary.json was not generated.'
          fi
          echo '--- Load test console tail ---'
          if [ -f devsecops-demo/out/01-testing/load/k6-console.txt ]; then
            tail -n 160 devsecops-demo/out/01-testing/load/k6-console.txt
          else
            echo 'k6-console.txt was not generated.'
          fi
          echo '--- DAST summary ---'
          if [ -f devsecops-demo/out/03-security/dast/zap-summary.json ]; then
            cat devsecops-demo/out/03-security/dast/zap-summary.json
          else
            echo 'zap-summary.json was not generated; DAST may have been disabled.'
          fi
          echo '--- DAST console tail ---'
          if [ -f devsecops-demo/out/03-security/dast/zap-console.txt ]; then
            tail -n 240 devsecops-demo/out/03-security/dast/zap-console.txt
          else
            echo 'zap-console.txt was not generated.'
          fi
          echo '--- ZAP report files ---'
          find devsecops-demo/out/03-security/dast -maxdepth 1 -type f -name 'zap-report-*' -print | sort || true
      - name: Upload full project runtime evidence
        if: ${{ always() && inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-full-project-runtime
          path: devsecops-demo/out/
          if-no-files-found: warn
          retention-days: 7
